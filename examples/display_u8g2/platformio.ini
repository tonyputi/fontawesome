; uIcons heart on a 128x64 SSD1306 driven by U8g2 (Arduino Uno, HW I2C).
[env:uno]
platform = atmelavr
board = uno
framework = arduino
; Headers come straight from the library checkout: this keeps sibling
; examples invisible to the Library Dependency Finder.
build_flags =
  -I../../src
lib_deps =
  olikraus/U8g2@2.36.18
