; uIcons heart on a 128x32 SSD1306 driven by Tiny4kOLED (Arduino Uno, HW I2C).
[env:uno]
platform = atmelavr
board = uno
framework = arduino
; Headers come straight from the library checkout: this keeps sibling
; examples invisible to the Library Dependency Finder.
build_flags =
  -I../../src
lib_deps =
  datacute/Tiny4kOLED@2.3.0
