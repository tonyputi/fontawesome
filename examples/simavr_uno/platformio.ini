; On-target test: quality.sh builds this firmware and runs it on a simulated
; ATmega328P (SimAVR), expecting "SIMAVR-TEST PASS". `pio run` builds the
; same firmware for real hardware. There is deliberately no `pio test`/Unity
; suite here: Unity prints over Arduino Serial, which is interrupt-driven,
; and the SimAVR build shipped by PlatformIO never delivers the UART
; data-register interrupt, so interrupt-driven output stays silent under
; simulation. The firmware therefore reports over a polled UART, which works
; on every host and on real hardware alike.
[env:uno]
platform = atmelavr
board = uno
framework = arduino
; Headers come straight from the library checkout: this keeps sibling
; examples invisible to the Library Dependency Finder.
build_flags =
  -I../../src
; Installs the simulator binary used by the simtest gate phase; the firmware
; itself is launched directly (see scripts/simavr_pty.py), not via pio test.
platform_packages =
  platformio/tool-simavr
