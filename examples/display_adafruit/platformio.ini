; uIcons heart on a 128x64 SSD1306 driven by Adafruit GFX (Arduino Uno, HW I2C).
[env:uno]
platform = atmelavr
board = uno
framework = arduino
; Headers come straight from the library checkout: this keeps sibling
; examples invisible to the Library Dependency Finder.
build_flags =
  -I../../src
lib_deps =
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit SSD1306@2.5.17
