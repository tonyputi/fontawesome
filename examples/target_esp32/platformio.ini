; Compile smoke for a 32-bit Arduino target: the core headers and a generated
; icon must build under the ESP32 toolchain (PROGMEM/pgmspace compat, C++
; dialect) with warnings as errors. No display library needed.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Headers come straight from the library checkout: this keeps sibling
; examples invisible to the Library Dependency Finder.
build_flags =
  -I../../src
  -Iinclude
  -Wall
  -Wextra
  -Werror
