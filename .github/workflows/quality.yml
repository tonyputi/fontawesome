name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Allow apt archive caching
        run: |
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-clang-format-clang-tidy-cppcheck

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('examples/**/platformio.ini') }}

      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang-format \
            clang-tidy \
            cppcheck
          python -m pip install --disable-pip-version-check 'platformio==6.2.0'

      - name: Run quality gate
        run: ./scripts/quality.sh
