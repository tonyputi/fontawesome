[project]
name = "uicons-tools"
version = "0.1.0"
description = "Offline, stdlib-only icon generator for the uIcons PlatformIO library"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Bug-catching rules only (pyflakes + pycodestyle errors). E501 keeps the
# 100-column budget shared with clang-format; test data (golden hex pins,
# inline manifests) is exempt since it cannot wrap.
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["E501"]
